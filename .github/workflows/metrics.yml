# .github/workflows/metrics.yml
#
# SETUP (one time):
#   1. Create a classic PAT: https://github.com/settings/tokens
#      Scopes: read:user  (add "repo" too if you want private-repo stats counted)
#   2. Repo Settings > Secrets and variables > Actions > New repository secret
#      Name: METRICS_TOKEN   Value: <the PAT>
#   3. Commit this file, then Actions tab > "Metrics" > Run workflow.
#
# It writes SVGs into metrics/ in this repo, so the README loads them from
# raw.githubusercontent.com - no third-party server to rate-limit you.

name: Metrics

on:
  schedule:
    - cron: "41 3 * * *"   # daily, odd minute on purpose
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Overview card - replaces github-readme-stats.vercel.app/api
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sagar-dignizant
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_display: large

      # Languages card - replaces .../api/top-langs
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sagar-dignizant
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

      # Year calendar - replaces github-readme-activity-graph.vercel.app
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sagar-dignizant
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
