# .github/workflows/metrics.yml
# Replaces your current metrics.yml (same path, same filename).
#
# Change from the last version: removed the "Calendar" step (the plain year
# heatmap). The animated activity graph now comes from your own Vercel
# deployment of github-readme-activity-graph instead - see the README.
#
# You can delete metrics/calendar.svg from the repo, it's no longer used.

name: Metrics

on:
  schedule:
    - cron: "41 3 * * *"   # daily, odd minute on purpose
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Commits / PRs, without the zero-filled sections
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sagar-dignizant
          filename: metrics/overview.svg
          template: classic
          base: header, activity
          config_timezone: Asia/Kolkata
          config_display: large

      # 3D isometric calendar + streak / commits-per-day facts
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sagar-dignizant
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------------------------------------------------------------------
      # Want the languages card back? Regenerate your PAT with the "repo"
      # scope ticked (that grants read/write on every private repo you can
      # access, including your employer's - your call), update the
      # METRICS_TOKEN secret, then uncomment this step:
      #
      # - name: Languages
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: sagar-dignizant
      #     filename: metrics/languages.svg
      #     base: ""
      #     config_timezone: Asia/Kolkata
      #     plugin_languages: yes
      #     plugin_languages_limit: 8
      #     plugin_languages_details: percentage
      #     plugin_languages_sections: most-used
      # ---------------------------------------------------------------------
